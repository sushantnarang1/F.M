name: Weekly inquiry report

on:
  schedule:
    # 14:00 UTC Thursday = 10:00 EDT or 09:00 EST.
    - cron: "0 14 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out report script
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google authentication library
        run: python -m pip install --disable-pip-version-check google-auth

      - name: Read private inquiries and deliver report
        env:
          INQUIRY_SHEET_ID: ${{ secrets.INQUIRY_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          REPORT_WEBHOOK_URL: ${{ secrets.REPORT_WEBHOOK_URL }}
          REPORT_WEBHOOK_TOKEN: ${{ secrets.REPORT_WEBHOOK_TOKEN }}
        run: python scripts/weekly_inquiry_report.py
